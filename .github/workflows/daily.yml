name: yaranimka

on:
  schedule:
    # Время в UTC, местное = UTC+4. Минуты намеренно не круглые: планировщик
    # Actions не гарантирует точность, а очередь на ровный час самая длинная —
    # туда целится большинство пользователей. Задержка в 5–20 минут обычна,
    # изредка бывает и час.
    #
    # 06:17 UTC = 10:17 — дайджест дня
    - cron: "17 6 * * *"
    # Дальше только обходы торрентов: серии выходят с 16:00 до 21:00 местного,
    # а озвучка появляется через несколько часов после эфира.
    #
    # 14:29 UTC = 18:29
    - cron: "29 14 * * *"
    # 16:43 UTC = 20:43
    - cron: "43 16 * * *"
    # 18:31 UTC = 22:31
    - cron: "31 18 * * *"
    # 21:23 UTC = 01:23 следующего дня — последний шанс: править сообщение
    # ВКонтакте разрешает лишь сутки с момента отправки.
    - cron: "23 21 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Что сделать"
        type: choice
        default: digest
        options: [digest, check]
      dry_run:
        description: "Только напечатать в лог, ничего не отправлять"
        type: boolean
        default: false

# Запуски идут строго друг за другом: каждый коммитит state.json,
# и параллельный прогон затёр бы чужую запись об отправленном сообщении.
concurrency:
  group: yaranimka
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      # нужно, чтобы коммитить обновлённый state.json обратно в репозиторий
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Запустить бота
        env:
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_CHAT_ID: ${{ secrets.VK_CHAT_ID }}
          # Часовой пояс задаёт и дату дайджеста, и время в строках расписания.
          # Раннер живёт в UTC, поэтому смещение обязано быть задано явно.
          YARANIMKA_TZ_OFFSET: ${{ vars.YARANIMKA_TZ_OFFSET || '4' }}
          YARANIMKA_NEWS: ${{ vars.YARANIMKA_NEWS || '3' }}
          YARANIMKA_MIN_SCORE: ${{ vars.YARANIMKA_MIN_SCORE || '0' }}
          YARANIMKA_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        # Дайджест уходит только по утреннему расписанию, остальные запуски
        # лишь дописывают ссылки на раздачи. Строка cron должна совпадать
        # с блоком schedule точь-в-точь, иначе режим молча станет check.
        run: |
          MODE="${{ inputs.mode || (github.event.schedule == '17 6 * * *' && 'digest') || 'check' }}"
          echo "Режим: $MODE"
          python -m yaranimka "$MODE"

      - name: Сохранить состояние
        if: ${{ !inputs.dry_run }}
        run: |
          # Без state.json бот забудет, какое сообщение править, и на каждом
          # обходе начинал бы день заново.
          if [[ ! -e state.json ]]; then
            echo "Состояния нет — сохранять нечего"
            exit 0
          fi

          git add state.json
          if git diff --cached --quiet; then
            echo "Состояние не изменилось"
            exit 0
          fi

          git config user.name  "yaranimka-bot"
          git config user.email "yaranimka-bot@users.noreply.github.com"
          git commit -m "chore: состояние yaranimka $(date -u +%Y-%m-%dT%H:%M)"
          # между запусками бот мог закоммитить из другого прогона
          git pull --rebase --autostash
          git push
