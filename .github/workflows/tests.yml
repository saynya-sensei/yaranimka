name: tests

# Проверка чужих правок. В беседу отсюда ничего не уходит — только pytest.
# На push в main тесты гоняет deploy.yml перед выкаткой, поэтому здесь
# остаётся один pull request: дублировать прогон незачем.
on:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Правкам из форка секреты не нужны и не выдаются: тесты сетью
    # не пользуются вовсе.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest tests -q
