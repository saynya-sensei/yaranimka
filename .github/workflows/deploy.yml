name: Deploy to Debian

on:
  push:
    branches:
      - main

# Два деплоя разом полезут в один каталог на сервере и передерутся
# за git pull. Пусть идут по очереди.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Красный коммит не должен доехать до сервера. Тесты идут без секретов
  # и без сети — пара секунд, зато бот не встанет в беседе из-за опечатки.
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest tests -q

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/docker/yaranimka
            git pull origin main
            docker compose down
            docker compose up --build -d
